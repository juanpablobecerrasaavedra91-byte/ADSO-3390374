<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-Video</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        .video-player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
        }
        .video-player video {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 0.5rem;
            background: #000;
            display: block;
        }
        .video-info {
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
        }
        .video-info code {
            background: rgba(0,0,0,0.4);
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            color: #ffb366;
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="bg-html">
    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="#fff" viewBox="0 0 256 256"><path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>14-Video</h1>
            <h4>Video files</h4>
        </header>
        <section>
            <div class="video-player">
                <video controls preload="auto" playsinline>
                    <source src="video/edit.mp4" type="video/mp4">
                </video>
                <div class="video-info">
                    <code>video/edit.mp4</code>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
