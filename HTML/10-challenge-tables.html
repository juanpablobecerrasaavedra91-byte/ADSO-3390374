<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Challenge-Tables</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #e040fb;
            color: #fff;
        }
        tbody tr:nth-child(even) {
            background: #16213e;
        }
        caption {
            caption-side: top;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px;
            color: #e040fb;
        }
    </style>
</head>
<body class="emmet bg-html">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header>
            <h1>10-Challenge-Tables</h1>
            <h4>Table challenge</h4>
        </header>
        <section>
            <table>
                <caption>Weekly Schedule</caption>
                <thead>
                    <tr>
                        <th>Hour</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>7:00 - 8:00</td>
                        <td>Math</td>
                        <td>English</td>
                        <td>Science</td>
                        <td>History</td>
                        <td>Art</td>
                    </tr>
                    <tr>
                        <td>8:00 - 9:00</td>
                        <td>English</td>
                        <td>Math</td>
                        <td>History</td>
                        <td>Science</td>
                        <td>Music</td>
                    </tr>
                    <tr>
                        <td>9:00 - 10:00</td>
                        <td>Science</td>
                        <td>History</td>
                        <td>Math</td>
                        <td>English</td>
                        <td>PE</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
