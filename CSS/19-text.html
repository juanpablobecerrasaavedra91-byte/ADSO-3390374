<!DOCTYPE html>
<html lang="en">
<head>

    <title>19-text</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section { text-align: left; display: grid; gap: 0.8rem; }
        .box {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            color: #fff;
        }
        .t-left { text-align: left; }
        .t-center { text-align: center; letter-spacing: 2px; }
        .t-right { text-align: right; text-transform: uppercase; }
        .t-justify { text-align: justify; line-height: 1.6; }
        .t-deco { text-align: center; text-decoration: underline wavy #ffb366; text-transform: capitalize; }
    </style>
</head>
<body class="bg-css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">

        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>19-Text</h1>
            <h4>text-align - transform - spacing - decoration</h4>
        </header>
        <section>
            <div class="box t-left">01 - Alineado a la izquierda (left).</div>
            <div class="box t-center">02 - Centrado con letter-spacing.</div>
            <div class="box t-right">03 - Derecha en mayúsculas.</div>
            <div class="box t-justify">04 - Justificado con line-height 1.6 para leer mejor este texto de ejemplo.</div>
