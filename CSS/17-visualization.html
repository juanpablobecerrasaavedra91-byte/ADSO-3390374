<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-visualization</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        .v-sec {
            position: relative;
            height: 350px;
        }

        .v-box {
            position: absolute;
            width: 100px;
            height: 100px;
        }

        .z-1 {
            display: block;
            visibility: visible;
            overflow: visible;
            z-index: 1;
            top: 20px;
            left: 20px;
            background-color: #ff4d4d;
        }

        .z-2 {
            display: inline;
            visibility: visible;
            overflow: hidden;
            z-index: 2;
            top: 50px;
            left: 50px;
            background-color: #4da6ff;
        }

        .z-3 {
            display: none;
            visibility: hidden;
            overflow: scroll;
            z-index: 3;
            top: 80px;
            left: 80px;
            background-color: #33cc33;
        }

        .z-4 {
            display: flex;
            visibility: visible;
            overflow: auto;
            z-index: 4;
            top: 110px;
            left: 110px;
            background-color: #ffcc00;
        }

        .z-5 {
            display: grid;
            visibility: visible;
            overflow: visible;
            z-index: 5;
            top: 140px;
            left: 140px;
            background-color: #cc33ff;
        }
    </style>
</head>
<body class="bg-css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://w3.org" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>17-visualization</h1>
            <h4>visualization</h4>
        </header>
        <section class="v-sec">
            <div class="v-box z-1">z-index_1</div>
            <div class="v-box z-2">z-index_2</div>
            <div class="v-box z-3">z-index_3</div>
            <div class="v-box z-4">z-index_4</div>
            <div class="v-box z-5">z-index_5</div>
        </section>
    </main>
</body>
</html>
