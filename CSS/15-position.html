<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-Position</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        .container {
            position: relative;
            width: 400px;
            height: 300px;
            border: 2px solid black;
            margin: 2rem auto;
        }
        .box {
            width: 80px;
            height: 50px;
            border: 2px solid white;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .static {
            background-color: gray;
            position: static;
        }
        .relative {
            background-color: blue;
            position: relative;
            top: 20px;
            left: 20px;
        }
        .absolute {
            background-color: red;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        .fixed {
            background-color: green;
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 999;
        }
        .sticky {
            background-color: orange;
            position: sticky;
            top: 0;
        }
    </style>
</head>
<body class="bg-css">
    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>15-Position</h1>
            <h4>Normal/Static | Relative | Absolute | Fixed | Sticky</h4>
        </header>
        <section>
            <div class="container">
                <div class="box static">static</div>
                <div class="box relative">relative (top:20 left:20)</div>
                <div class="box absolute">absolute (bottom:10 right:10)</div>
            </div>
            <p>Scroll to see <strong>sticky</strong> and <strong>fixed</strong>:</p>
            <div class="box sticky">sticky (top:0)</div>
            <div style="height:600px; background:linear-gradient(to bottom, transparent, #ccc);"></div>
            <div class="box fixed">fixed (bottom:right)</div>
        </section>
    </main>
</body>
</html>
