<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-sprite</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section { display: grid; gap: 0.8rem; text-align: center; }
        .box {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            padding: 1rem;
            color: #fff;
        }
        /* Niña: 1536x256 = 6 frames de 256x256 */
        .girl {
            width: 160px; height: 160px; margin: 0 auto;
            background: url('Imgs/run-sprite.png') 0 0 / 960px 160px no-repeat;
            animation: girl 0.8s steps(6) infinite;
        }
        @keyframes girl { to { background-position-x: -960px; } }
        /* Dino: 260x128 = 2 frames de 130x128 */
        .dino {
            width: 130px; height: 128px; margin: 0 auto;
            background: url('Imgs/dino-sprite.png') 0 0 / 260px 128px no-repeat;
            animation: dino 0.4s steps(2) infinite;
        }
        @keyframes dino { to { background-position-x: -260px; } }
    </style>
</head>
<body class="bg-css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>23-Sprite</h1>
            <h4>steps() - background-position</h4>
        </header>
        <section>
            <div class="box"><div class="girl"></div><p>Niña 6 frames</p></div>
            <div class="box"><div class="dino"></div><p>Dino 2 frames</p></div>
        </section>
    </main>
</body>
</html>
