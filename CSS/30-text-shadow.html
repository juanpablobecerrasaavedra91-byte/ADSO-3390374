    <title>30-text-shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt {
                font-size: 2rem;
                margin-block: 4rem;
                text-align: center;

                &.txt1 {
                    color: black;
                }

                &.txt2 {
                    color: crimson;
                }

                &.txt3 {
                    color: #fc5900;
                    font-weight: bold;
                    text-shadow: 1px 1px 0px #b33f00, 2px 2px 0px #b33f00, 3px 3px 0px #b33f00, 4px 4px 0px #b33f00;
                }

                &.txt4 {
                    color: darkblue;
                    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
                }
            }
        }
    </style>
</head>
