<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03-Attr-Style</title>
    <link rel="stylesheet" href="../src/css/master.css">
</head>
<body class="bg-css">
    <a href="index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>03-attribute-style</h1>
            <h3>This way we can include CSS within the style attribute in the html tag, it is the least recommended way.</h3>
            <h4>Flags with inline style</h4>
        </header>
        <section>
            <h3>Poland</h3>
            <div style="width:300px;height:200px;margin:1rem auto;box-shadow:0 0 5px rgba(0,0,0,0.3);">
                <div style="height:50%;background:white;"></div>
                <div style="height:50%;background:#dc143c;"></div>
            </div>
        </section>
        <section>
            <h3>Peru</h3>
            <div style="width:300px;height:200px;margin:1rem auto;display:flex;box-shadow:0 0 5px rgba(0,0,0,0.3);">
                <div style="flex:1;background:#dc143c;"></div>
                <div style="flex:2;background:white;"></div>
                <div style="flex:1;background:#dc143c;"></div>
            </div>
        </section>
        <section>
            <h3>Germany</h3>
            <div style="width:300px;height:200px;margin:1rem auto;box-shadow:0 0 5px rgba(0,0,0,0.3);">
                <div style="height:33.33%;background:black;"></div>
                <div style="height:33.33%;background:#dd0000;"></div>
                <div style="height:33.33%;background:#ffcc00;"></div>
            </div>
        </section>
    </main>
</body>
</html>
