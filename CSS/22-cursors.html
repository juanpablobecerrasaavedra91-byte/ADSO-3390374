<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22-cursors</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .cbox {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0.8rem;
            padding: 1rem 0.5rem;
            color: #fff;
            font-size: 0.85rem;
        }
        .c-default { cursor: default; }
        .c-pointer { cursor: pointer; }
        .c-cross { cursor: crosshair; }
        .c-move { cursor: move; }
        .c-text { cursor: text; }
        .c-custom { cursor: url('Imgs/basketball.png') 10 10, pointer; }
    </style>
</head>
<body class="bg-css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>22-Cursors</h1>
            <h4>cursor + custom con basketball.png</h4>
        </header>
        <section>
            <div class="cbox c-default">default</div>
            <div class="cbox c-pointer">pointer</div>
            <div class="cbox c-cross">crosshair</div>
            <div class="cbox c-move">move</div>
            <div class="cbox c-text">text</div>
            <div class="cbox c-custom">⚽ custom ball</div>
        </section>
    </main>
</body>
</html>
